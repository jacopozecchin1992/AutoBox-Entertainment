name: Compila AutoBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installa SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "Uso $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compila APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verifica firma e archivio
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 15
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/autobox-manifest.txt
          grep -q 'android.media.browse.MediaBrowserService' /tmp/autobox-manifest.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" res/xml/automotive_app_desc.xml > /tmp/autobox-media.txt
          grep -q 'media' /tmp/autobox-media.txt
          unzip -l "$APK" | grep -q 'assets/autobox.html'
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBox-Entertainment-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Pubblica APK come download diretto GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if gh release view v2.5.0 >/dev/null 2>&1; then
            gh release upload v2.5.0 "$APK#AutoBox-Entertainment.apk" --clobber
          else
            gh release create v2.5.0 "$APK#AutoBox-Entertainment.apk" --title "AutoBox Entertainment 2.5.0" --notes "APK Android universale compilato con Gradle da GitHub Actions. Scorciatoie native per le app installate sul Samsung. Include servizio POI Android Auto; per visualizzarlo sulle auto reali occorre installare tramite Google Play Internal app sharing. Video solo sul telefono."
          fi
